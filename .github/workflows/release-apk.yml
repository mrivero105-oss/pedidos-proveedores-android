name: Publicar APK OTA (GitHub Releases)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión semántica a publicar (ej. 1.1.0)'
        required: true
        default: '1.1.0'
      release_notes:
        description: 'Novedades de esta versión'
        required: false
        default: 'Actualización OTA con mejoras y correcciones.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolver versión
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version_name }}"
            TAG="v${RAW_VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            RAW_VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          # versionCode creciente basado en run_number (siempre mayor que el anterior)
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Preparar keystore de firma (si existe en Secrets)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        id: build_apk
        shell: bash
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          OTA_GITHUB_REPO: ${{ github.repository }}
          SIGNING_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pedidos-release' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            APK_OUT="pedidos-proveedores-${APP_VERSION_NAME}-release.apk"
          else
            ./gradlew assembleDebug --no-daemon
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
            APK_OUT="pedidos-proveedores-${APP_VERSION_NAME}-debug.apk"
          fi
          cp "$APK_SRC" "$APK_OUT"
          SHA=$(sha256sum "$APK_OUT" | awk '{print $1}')
          echo "apk_file=${APK_OUT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release para actualización OTA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Pedidos Proveedores ${{ steps.version.outputs.tag }}"
          body: |
            ${{ github.event.inputs.release_notes || 'Nueva versión disponible por actualización OTA.' }}

            SHA256: ${{ steps.build_apk.outputs.sha256 }}
          files: |
            ${{ steps.build_apk.outputs.apk_file }}
