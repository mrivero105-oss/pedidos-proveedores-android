name: Publicar APK OTA (GitHub Releases)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión semántica a publicar (ej. 1.1.0)'
        required: true
        default: '1.1.0'
      release_notes:
        description: 'Novedades de esta versión'
        required: false
        default: 'Actualización OTA con mejoras y correcciones.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolver versión
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version_name }}"
            TAG="v${RAW_VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            RAW_VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          # versionCode creciente basado en run_number (siempre mayor que el anterior)
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas unitarias
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Preparar keystore de firma (si existe en Secrets)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "${RUNNER_TEMP}/release.jks"
            STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            # Si se copió accidentalmente la línea completa "KEYSTORE_PASSWORD=valor", probar también la parte derecha
            if ! keytool -list -keystore "${RUNNER_TEMP}/release.jks" -storepass "$STORE_PASS" >/dev/null 2>&1; then
              if [[ "$STORE_PASS" == *"="* ]]; then
                ALT_PASS="${STORE_PASS#*=}"
                if keytool -list -keystore "${RUNNER_TEMP}/release.jks" -storepass "$ALT_PASS" >/dev/null 2>&1; then
                  STORE_PASS="$ALT_PASS"
                fi
              fi
            fi

            KT_LIST=$(keytool -list -keystore "${RUNNER_TEMP}/release.jks" -storepass "$STORE_PASS" 2>&1) || {
              echo "::error::No se pudo abrir release.jks con KEYSTORE_PASSWORD (tamaño JKS: $(wc -c < "${RUNNER_TEMP}/release.jks") bytes)."
              exit 1
            }

            ALIAS_CANDIDATE=$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            ALIAS_CANDIDATE="${ALIAS_CANDIDATE#KEY_ALIAS=}"
            if [ -n "$ALIAS_CANDIDATE" ] && keytool -list -keystore "${RUNNER_TEMP}/release.jks" -storepass "$STORE_PASS" -alias "$ALIAS_CANDIDATE" >/dev/null 2>&1; then
              RESOLVED_ALIAS="$ALIAS_CANDIDATE"
            else
              RESOLVED_ALIAS=$(printf '%s\n' "$KT_LIST" | awk -F',' '/PrivateKeyEntry/{gsub(/^[ \t]+|[ \t]+$/, "", $1); if (!found) { print $1; found=1 }}')
            fi

            if [ -z "$RESOLVED_ALIAS" ]; then
              echo "::error::No se encontró ninguna entrada PrivateKeyEntry dentro de release.jks."
              exit 1
            fi

            KEY_PASS=$(printf '%s' "$KEY_PASSWORD_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            KEY_PASS="${KEY_PASS#KEY_PASSWORD=}"
            if [ -z "$KEY_PASS" ]; then
              KEY_PASS="$STORE_PASS"
            fi

            echo "::add-mask::${STORE_PASS}"
            echo "::add-mask::${KEY_PASS}"
            echo "Keystore verificado correctamente (alias detectado: ${RESOLVED_ALIAS})."
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
            echo "store_password=${STORE_PASS}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${RESOLVED_ALIAS}" >> "$GITHUB_OUTPUT"
            echo "key_password=${KEY_PASS}" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        id: build_apk
        shell: bash
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          OTA_GITHUB_REPO: ${{ github.repository }}
          SIGNING_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          SIGNING_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          SIGNING_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
            APK_OUT="pedidos-proveedores-${APP_VERSION_NAME}-release.apk"
          else
            ./gradlew assembleDebug --no-daemon
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
            APK_OUT="pedidos-proveedores-${APP_VERSION_NAME}-debug.apk"
          fi
          cp "$APK_SRC" "$APK_OUT"
          SHA=$(sha256sum "$APK_OUT" | awk '{print $1}')
          echo "apk_file=${APK_OUT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release para actualización OTA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Pedidos Proveedores ${{ steps.version.outputs.tag }}"
          body: |
            ${{ github.event.inputs.release_notes || 'Nueva versión disponible por actualización OTA.' }}

            SHA256: ${{ steps.build_apk.outputs.sha256 }}
          files: |
            ${{ steps.build_apk.outputs.apk_file }}
